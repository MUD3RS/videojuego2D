<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacific Rim - Visor de Cabina Jaeger</title>
    <!-- Favicon desde la carpeta assets (Requisito 4) -->
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <!-- Bootstrap CSS en línea (Requisito 7) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER: Título principal en la parte superior (Requisito 7) -->
    <header class="text-center position-absolute w-100 z-3" style="top: 10px;">
        <div class="d-flex justify-content-center align-items-center gap-2">
            <img src="assets/logo_jaeger.png" alt="Jaeger Logo" style="height: 35px; width: auto;" onerror="this.style.display='none'">
            <h1 class="hud-title m-0">SINCRO-PONS // PROTOCOLO DE DEFENSA KAIJU</h1>
        </div>
    </header>

    <!-- MAIN: EL CASCO Y VISOR JAEGER (Requisito 7) -->
    <main class="helmet-container">
        
        <!-- Techo estructural de la cabina -->
        <div class="helmet-ceiling"></div>

        <!-- Paneles laterales inclinados del visor -->
        <div class="helmet-left-panel"></div>
        <div class="helmet-right-panel"></div>

        <!-- Ventana central del Visor (Canvas 2D e Interfaz de Inicio) -->
        <div class="visor-window">
            
            <!-- PANTALLA DE INICIO (Menú Previo) -->
            <div id="startScreen" class="start-overlay d-flex flex-column justify-content-center align-items-center text-center p-4">
                <h2 class="text-info fw-bold mb-3 tracking-wide" style="text-shadow: 0 0 15px #00d2ff;">SISTEMA JAEGER LISTO</h2>
                <p class="text-light mb-2" style="max-width: 500px; font-size: 0.9rem;">
                    Inicia el enlace neuronal para desplegar la defensa contra las 25 amenazas Kaiju en la brecha.
                </p>
                
                <!-- Botón para iniciar el juego -->
                <button id="btnStart" class="btn btn-outline-info btn-lg px-4 py-2 mt-3 fw-bold text-uppercase shadow-lg">
                    [ INICIAR ENLACE NEURONAL ]
                </button>

                <!-- Créditos colocados dentro del visor (Requisito 7) -->
                <div class="mt-4 text-secondary small">
                    <p class="m-0"></p>
                    <p class="m-0"></p>
                </div>
            </div>

            <!-- ELEMENTOS HUD EN JUEGO (Ocultos al inicio) -->
            <div id="instructionsHud" class="instructions-hud d-none">
                <p class="m-0 text-info fw-bold">ALERTA DE INCURSIÓN:</p>
                <p class="m-0 text-light" style="font-size: 0.75rem;">Haz clic sobre las amenazas Kaiju para eliminarlas.</p>
            </div>
            
            <div id="counterHud" class="counter-hud d-none">
                <span>KAIJUS NEUTRALIZADOS: </span><span id="contador" class="text-info fw-bold">0</span>
            </div>

            <!-- CANVAS DEL JUEGO (Requisito 1) -->
            <canvas id="gameCanvas" width="1000" height="600"></canvas>
        </div>

        <!-- Consola inferior del Jaeger -->
        <div class="helmet-dashboard">
            <div class="dashboard-screen"></div>
            <div class="dashboard-buttons"></div>
        </div>

    </main>

    <!-- Audio / Música de fondo (Requisito 4) -->
    <audio id="bgMusic" loop preload="auto">
        <source src="assets/musica.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
